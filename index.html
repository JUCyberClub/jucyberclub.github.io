<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نادي الأمن السيبراني</title>
<meta name="description" content="منصة العمل الداخلية لنادي الأمن السيبراني بجامعة جازان">
<meta name="theme-color" content="#0c1d86">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="النادي">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<style>
  html,body{margin:0;height:100%;background:#04105a;overflow:hidden}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}
  .ld{position:fixed;inset:0;display:grid;place-items:center;color:#c3cdf6;font:500 15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;
      background:linear-gradient(165deg,#0c1d86,#04105a 55%,#020a3d);transition:opacity .3s}
  .ld img{width:64px;height:64px;border-radius:16px;display:block;margin:0 auto 12px}
  .ld.out{opacity:0;pointer-events:none}
</style>
</head>
<body>
<div class="ld" id="ld"><div><img src="apple-touch-icon.png" alt="">جارِ فتح المنصة…</div></div>
<iframe id="app" title="منصة نادي الأمن السيبراني" allow="clipboard-write"></iframe>
<script>
  // يفتح المنصة داخل هذه الصفحة، وينقل أي معلومات في الرابط (مثل رابط سجل من إيميل) كما هي
  var BASE = 'https://script.google.com/macros/s/AKfycbwfZT0QD2VCGEKlYHCII3eWDnnTiSRqKs4VfM7smZNj0BlEU13Ui6znURxSkq66Fg_szg/exec';
  var f = document.getElementById('app'), ld = document.getElementById('ld');
  f.addEventListener('load', function () { setTimeout(function () { ld.className = 'ld out'; }, 400); });
  f.src = BASE + (location.search || '');
</script>
</body>
</html>
